<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#ffe08a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== ACTIVE BRAIN ===== -->
  <ellipse cx="300" cy="195" rx="250" ry="170" fill="url(#glow)"/>
  <g transform="translate(8 42) scale(0.6)">
    <path d="M478 400 C 488 450 496 500 500 560 L 552 560 C 550 500 546 440 548 392 Z" fill="#4f8f9a" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="652" cy="408" rx="88" ry="52" fill="#4f8f9a" stroke="#ffffff" stroke-width="7"/>
    <path d="M215 300 C 200 210 270 125 390 105 C 510 85 645 110 720 180 C 770 228 772 300 740 345 C 715 378 680 388 640 382 C 600 378 570 388 540 400 C 500 418 430 425 380 412 C 335 400 310 375 300 345 C 275 345 235 335 215 300 Z"
          fill="#fff1c7" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <g fill="none" stroke="#e8b94a" stroke-width="8" stroke-linecap="round">
      <path d="M300 345 C 360 320 430 300 500 300"/>
      <path d="M470 98 C 455 160 470 220 452 290"/>
      <path d="M300 170 C 330 200 320 240 350 260"/>
      <path d="M580 130 C 560 180 600 220 580 270"/>
      <path d="M660 200 C 640 240 680 270 660 320"/>
    </g>
  </g>
  <!-- sparks -->
  <g stroke="#ffe08a" stroke-width="6" stroke-linecap="round">
    <line x1="120" y1="80" x2="98" y2="58"/>
    <line x1="300" y1="56" x2="300" y2="30" />
    <line x1="480" y1="80" x2="502" y2="58"/>
    <line x1="92" y1="200" x2="62" y2="200"/>
  </g>

  <!-- EEG: fast, awake-like waves -->
  <text x="540" y="140" font-size="34" font-weight="800" fill="#ffe08a">BRAIN ACTIVE</text>
  <path d="M540 205 l14 -26 l14 40 l14 -50 l14 46 l14 -30 l14 36 l14 -44 l14 30 l14 -22 l14 40 l14 -48 l14 38 l14 -26 l14 30 l14 -36 l14 22 l14 -10 l14 26"
        fill="none" stroke="#ffe08a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- divider -->
  <line x1="60" y1="372" x2="840" y2="372" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round"/>

  <!-- ===== STILL BODY ===== -->
  <!-- bed -->
  <rect x="60" y="618" width="780" height="34" rx="17" fill="rgba(255,255,255,0.16)" stroke="#e3fbff" stroke-width="4"/>
  <ellipse cx="150" cy="590" rx="80" ry="28" fill="rgba(227,251,255,0.35)" stroke="#e3fbff" stroke-width="4"/>
  <!-- legs -->
  <rect x="560" y="530" width="250" height="78" rx="39" fill="#2f7f99" stroke="#e3fbff" stroke-width="5"/>
  <!-- torso -->
  <rect x="225" y="510" width="380" height="100" rx="50" fill="#2f7f99" stroke="#e3fbff" stroke-width="5"/>
  <!-- relaxed muscles (dimmed) -->
  <ellipse cx="370" cy="545" rx="90" ry="24" fill="rgba(201,184,255,0.45)" stroke="#c9b8ff" stroke-width="4" stroke-dasharray="6 8"/>
  <ellipse cx="670" cy="560" rx="85" ry="22" fill="rgba(201,184,255,0.45)" stroke="#c9b8ff" stroke-width="4" stroke-dasharray="6 8"/>
  <!-- head -->
  <circle cx="178" cy="534" r="50" fill="rgba(227,251,255,0.3)" stroke="#e3fbff" stroke-width="5"/>
  <path d="M150 530 Q 162 540 174 530" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#7fe3ff" stroke-width="4" stroke-linecap="round">
    <line x1="140" y1="512" x2="132" y2="504"/>
    <line x1="184" y1="512" x2="192" y2="504"/>
  </g>

  <!-- eyes label -->
  <text x="90" y="452" font-size="30" font-weight="800" fill="#7fe3ff">EYES DART</text>

  <!-- power off icon + label -->
  <g fill="none" stroke="#c9b8ff" stroke-width="6" stroke-linecap="round">
    <path d="M488 428 A 30 30 0 1 0 528 428"/>
    <line x1="508" y1="410" x2="508" y2="440"/>
  </g>
  <text x="560" y="452" font-size="34" font-weight="800" fill="#c9b8ff">MUSCLES LIMP</text>
  <line x1="508" y1="480" x2="440" y2="530" stroke="#c9b8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <line x1="508" y1="480" x2="640" y2="540" stroke="#c9b8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
</svg>
