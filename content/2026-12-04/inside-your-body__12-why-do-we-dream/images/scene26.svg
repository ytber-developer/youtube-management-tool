<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <!-- axes -->
  <line x1="160" y1="130" x2="160" y2="600" stroke="#e3fbff" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="600" x2="780" y2="600" stroke="#e3fbff" stroke-width="4" stroke-linecap="round"/>
  <text transform="translate(118 365) rotate(-90)" font-size="30" font-weight="700" fill="#e3fbff" text-anchor="middle" letter-spacing="2">IMPROVEMENT</text>

  <!-- bar: no maze dream (1x) -->
  <rect x="230" y="556" width="180" height="44" rx="12" fill="#7fe3ff"/>
  <text x="320" y="530" font-size="40" font-weight="800" fill="#7fe3ff" text-anchor="middle">1×</text>

  <!-- bar: maze dream (~10x) -->
  <rect x="530" y="160" width="180" height="440" rx="16" fill="#ffe08a"/>
  <text x="620" y="134" font-size="40" font-weight="800" fill="#ffe08a" text-anchor="middle">≈10×</text>
  <!-- maze icon -->
  <g fill="none" stroke="#06233d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <rect x="570" y="230" width="100" height="100" rx="8"/>
    <path d="M570 263 H630 M603 296 H670 M603 263 V296 M637 230 V250"/>
  </g>

  <!-- category labels -->
  <g font-size="30" font-weight="800" text-anchor="middle">
    <text x="320" y="650" fill="#e3fbff">NO MAZE</text>
    <text x="320" y="690" fill="#e3fbff">DREAM</text>
    <text x="620" y="650" fill="#ffe08a">MAZE</text>
    <text x="620" y="690" fill="#ffe08a">DREAM</text>
  </g>
</svg>
