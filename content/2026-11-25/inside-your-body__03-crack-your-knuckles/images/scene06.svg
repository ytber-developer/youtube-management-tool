<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <radialGradient id="gas" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3fbff" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <!-- BEFORE -->
  <text x="120" y="80" font-size="34" font-weight="800" fill="#ffffff">BEFORE</text>
  <ellipse cx="440" cy="200" rx="145" ry="80" fill="rgba(127,227,255,0.38)" stroke="#7fe3ff" stroke-width="6"/>
  <rect x="120" y="160" width="310" height="80" rx="40" fill="#fff1c7" stroke="#ffffff" stroke-width="4"/>
  <rect x="450" y="160" width="310" height="80" rx="40" fill="#fff1c7" stroke="#ffffff" stroke-width="4"/>
  <line x1="440" y1="296" x2="440" y2="262" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="440" cy="262" r="6" fill="#ffffff"/>
  <text x="440" y="330" text-anchor="middle" font-size="30" font-weight="700" fill="#e3fbff">SYNOVIAL FLUID</text>

  <!-- transition arrow -->
  <line x1="810" y1="215" x2="810" y2="500" stroke="#ffe08a" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round" marker-end="url(#ay)" opacity="0.8"/>

  <!-- AFTER -->
  <text x="120" y="420" font-size="34" font-weight="800" fill="#ffffff">AFTER</text>
  <ellipse cx="440" cy="540" rx="170" ry="72" fill="rgba(127,227,255,0.38)" stroke="#7fe3ff" stroke-width="6"/>
  <rect x="150" y="500" width="240" height="80" rx="40" fill="#fff1c7" stroke="#ffffff" stroke-width="4"/>
  <rect x="490" y="500" width="240" height="80" rx="40" fill="#fff1c7" stroke="#ffffff" stroke-width="4"/>
  <!-- gas cavity -->
  <ellipse cx="440" cy="540" rx="36" ry="44" fill="url(#gas)" stroke="#ffffff" stroke-width="4"/>
  <!-- pull arrows -->
  <line x1="138" y1="540" x2="62" y2="540" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)"/>
  <line x1="742" y1="540" x2="818" y2="540" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)"/>

  <line x1="440" y1="652" x2="440" y2="590" stroke="#ffe08a" stroke-width="4" stroke-linecap="round"/>
  <text x="440" y="696" text-anchor="middle" font-size="36" font-weight="800" fill="#ffe08a">CAVITY FORMS</text>
</svg>
