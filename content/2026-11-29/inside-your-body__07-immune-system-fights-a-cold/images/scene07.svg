<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffffff"/>
    </marker>
    <!-- rhinovirus: small icosahedral (non-enveloped) particle -->
    <g id="v">
      <path d="M0 -24 L20.8 -12 L20.8 12 L0 24 L-20.8 12 L-20.8 -12 Z" fill="#ff8a7a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -24 L0 0 M20.8 12 L0 0 M-20.8 12 L0 0" stroke="#ffd2cb" stroke-width="3"/>
    </g>
  </defs>

  <!-- cards -->
  <g fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.25)" stroke-width="4">
    <rect x="60" y="40" width="370" height="300" rx="26"/>
    <rect x="470" y="40" width="370" height="300" rx="26"/>
    <rect x="470" y="400" width="370" height="300" rx="26"/>
    <rect x="60" y="400" width="370" height="300" rx="26"/>
  </g>
  <!-- nasal cells (membrane on top) -->
  <g fill="rgba(227,251,255,0.16)" stroke="#e3fbff" stroke-width="4">
    <rect x="80" y="190" width="330" height="130" rx="22"/>
    <path d="M490 212 Q490 190 512 190 L620 190 Q630 190 632 200 Q655 222 678 200 Q680 190 690 190 L798 190 Q820 190 820 212 L820 298 Q820 320 798 320 L512 320 Q490 320 490 298 Z"/>
    <rect x="490" y="550" width="330" height="130" rx="22"/>
    <rect x="80" y="550" width="330" height="130" rx="22"/>
  </g>

  <!-- cycle arrows -->
  <line x1="434" y1="190" x2="464" y2="190" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)"/>
  <line x1="655" y1="344" x2="655" y2="392" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)"/>
  <line x1="466" y1="550" x2="436" y2="550" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)"/>

  <!-- 1 BIND -->
  <text x="90" y="96" font-size="34" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">1 </tspan>BIND</text>
  <line x1="330" y1="190" x2="330" y2="164" stroke="#8ee6a8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="330" cy="158" r="10" fill="#8ee6a8"/>
  <use href="#v" x="330" y="124"/>
  <text x="298" y="172" text-anchor="end" font-size="28" font-weight="700" fill="#8ee6a8">RECEPTOR</text>

  <!-- 2 ENTER -->
  <text x="500" y="96" font-size="34" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">2 </tspan>ENTER</text>
  <circle cx="655" cy="258" r="38" fill="rgba(255,255,255,0.10)" stroke="#e3fbff" stroke-width="4" stroke-dasharray="8 7"/>
  <use href="#v" x="655" y="258"/>
  <line x1="760" y1="110" x2="690" y2="220" stroke="#ffffff" stroke-width="6" stroke-linecap="round" marker-end="url(#aw)"/>

  <!-- 3 COPY -->
  <text x="500" y="456" font-size="34" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">3 </tspan>COPY</text>
  <g transform="translate(0,0)">
    <use href="#v" transform="translate(545 595) scale(0.7)"/>
    <use href="#v" transform="translate(605 625) scale(0.7)"/>
    <use href="#v" transform="translate(665 592) scale(0.7)"/>
    <use href="#v" transform="translate(725 628) scale(0.7)"/>
    <use href="#v" transform="translate(780 594) scale(0.7)"/>
    <use href="#v" transform="translate(560 650) scale(0.7)"/>
    <use href="#v" transform="translate(680 652) scale(0.7)"/>
    <use href="#v" transform="translate(775 652) scale(0.7)"/>
  </g>

  <!-- 4 RELEASE -->
  <text x="90" y="456" font-size="34" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">4 </tspan>RELEASE</text>
  <use href="#v" x="140" y="520"/>
  <use href="#v" x="225" y="500"/>
  <use href="#v" x="310" y="520"/>
  <use href="#v" transform="translate(200 620) scale(0.7)"/>
  <line x1="342" y1="508" x2="408" y2="484" stroke="#ffffff" stroke-width="6" stroke-linecap="round" marker-end="url(#aw)"/>
</svg>
