<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <!-- grid -->
  <g stroke="rgba(255,255,255,0.16)" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round">
    <line x1="170" y1="120" x2="820" y2="120"/>
    <line x1="170" y1="267" x2="820" y2="267"/>
    <line x1="170" y1="413" x2="820" y2="413"/>
  </g>
  <!-- axes -->
  <line x1="170" y1="100" x2="170" y2="560" stroke="#e3fbff" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="560" x2="830" y2="560" stroke="#e3fbff" stroke-width="4" stroke-linecap="round"/>
  <g font-size="28" font-weight="700" fill="#e3fbff" text-anchor="end">
    <text x="150" y="130">70</text>
    <text x="150" y="277">60</text>
    <text x="150" y="423">50</text>
    <text x="150" y="570">40</text>
  </g>
  <text transform="translate(76 340) rotate(-90)" font-size="28" font-weight="700" fill="#7fe3ff" text-anchor="middle" letter-spacing="1">AGE OF PEAK VOCABULARY</text>

  <!-- area + line -->
  <path d="M270 531 L495 413 L720 193 L720 560 L270 560 Z" fill="rgba(255,224,138,0.14)"/>
  <path d="M270 531 L495 413 L720 193" fill="none" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffe08a" stroke="#ffffff" stroke-width="5">
    <circle cx="270" cy="531" r="15"/>
    <circle cx="495" cy="413" r="15"/>
    <circle cx="720" cy="193" r="15"/>
  </g>

  <!-- point labels -->
  <g font-size="32" font-weight="800" fill="#ffe08a" text-anchor="middle">
    <text x="268" y="474" font-size="28">EARLY 40s</text>
    <text x="495" y="376">≈50</text>
    <text x="720" y="156">≈65</text>
  </g>

  <!-- x labels -->
  <g font-size="28" font-weight="700" fill="#e3fbff" text-anchor="middle">
    <text x="270" y="606">1974–87</text>
    <text x="495" y="606">1988–97</text>
    <text x="720" y="606">1998–2012</text>
  </g>
  <text x="495" y="660" font-size="28" font-weight="700" fill="#7fe3ff" text-anchor="middle" letter-spacing="2">SURVEY YEARS</text>
</svg>
