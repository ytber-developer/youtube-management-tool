<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e3fbff"/>
    </marker>
  </defs>
  <!-- x: hours awake 0..24 over x 140..800 (27.5 px/h); y: BAC 0..0.12 over 600..140 -->

  <!-- axes -->
  <line x1="140" y1="130" x2="140" y2="600" stroke="#e3fbff" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="600" x2="850" y2="600" stroke="#e3fbff" stroke-width="5" stroke-linecap="round" marker-end="url(#ax)"/>
  <text x="92" y="370" text-anchor="middle" font-size="28" font-weight="700" fill="#e3fbff" transform="rotate(-90 92 370)">LIKE BLOOD ALCOHOL</text>

  <!-- legal driving limit 0.08% -->
  <line x1="140" y1="293" x2="840" y2="293" stroke="#ff8a7a" stroke-width="5" stroke-dasharray="16 12" stroke-linecap="round"/>
  <text x="160" y="276" font-size="30" font-weight="800" fill="#ff8a7a">US DRIVING LIMIT 0.08%</text>

  <!-- guides -->
  <g stroke="rgba(227,251,255,0.5)" stroke-width="4" stroke-dasharray="6 10" stroke-linecap="round">
    <line x1="608" y1="420" x2="608" y2="596"/>
    <line x1="800" y1="230" x2="800" y2="596"/>
  </g>

  <!-- impairment curve -->
  <path d="M140 598 C 380 592, 500 500, 608 408 L 800 217" fill="none" stroke="#ffe08a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="608" cy="408" r="14" fill="#ffe08a" stroke="#ffffff" stroke-width="4"/>
  <circle cx="800" cy="217" r="14" fill="#ff8a7a" stroke="#ffffff" stroke-width="4"/>

  <text x="586" y="392" text-anchor="end" font-size="38" font-weight="800" fill="#ffe08a">0.05%</text>
  <text x="800" y="186" text-anchor="middle" font-size="38" font-weight="800" fill="#ff8a7a">0.10%</text>

  <!-- x labels -->
  <g font-size="30" font-weight="800" text-anchor="middle">
    <text x="140" y="646" fill="#e3fbff" font-weight="600" font-size="26">0</text>
    <text x="608" y="646" fill="#ffe08a">17 H</text>
    <text x="800" y="646" fill="#ff8a7a">24 H</text>
  </g>
  <text x="470" y="706" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">HOURS AWAKE</text>
</svg>
