<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7fe3ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8ee6a8"/>
    </marker>
  </defs>

  <!-- cards: 1 TL, 2 TR, 3 BR, 4 BL -->
  <g fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.28)" stroke-width="4">
    <rect x="70" y="40" width="350" height="250" rx="28"/>
    <rect x="480" y="40" width="350" height="250" rx="28"/>
    <rect x="480" y="340" width="350" height="250" rx="28"/>
    <rect x="70" y="340" width="350" height="250" rx="28"/>
  </g>

  <!-- flow arrows -->
  <line x1="428" y1="165" x2="466" y2="165" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ar)"/>
  <line x1="655" y1="298" x2="655" y2="328" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ar)"/>
  <line x1="472" y1="465" x2="434" y2="465" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ar)"/>

  <!-- 1: jaw opens (face with wide mouth) -->
  <g transform="translate(245,140)">
    <circle r="62" fill="#e3fbff" opacity="0.92"/>
    <path d="M-34 -18 q12 -10 24 0 M10 -18 q12 -10 24 0" fill="none" stroke="#0a3f66" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="24" rx="20" ry="28" fill="#0a3f66"/>
    <line x1="90" y1="-30" x2="90" y2="34" stroke="#ffe08a" stroke-width="6" stroke-linecap="round" marker-end="url(#ar)"/>
  </g>
  <text x="245" y="262" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">1 </tspan>JAW OPENS</text>

  <!-- 2: deep inhale (lungs filling, air in) -->
  <g transform="translate(655,145)">
    <path d="M-10 -40 C -60 -40 -78 10 -72 48 C -68 64 -40 66 -14 52 Z" fill="#7fe3ff" opacity="0.85"/>
    <path d="M10 -40 C 60 -40 78 10 72 48 C 68 64 40 66 14 52 Z" fill="#7fe3ff" opacity="0.85"/>
    <line x1="0" y1="-60" x2="0" y2="-26" stroke="#e3fbff" stroke-width="7" stroke-linecap="round"/>
    <line x1="-120" y1="-40" x2="-90" y2="-10" stroke="#7fe3ff" stroke-width="6" stroke-linecap="round" marker-end="url(#ac)"/>
    <line x1="120" y1="-40" x2="90" y2="-10" stroke="#7fe3ff" stroke-width="6" stroke-linecap="round" marker-end="url(#ac)"/>
  </g>
  <text x="655" y="262" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">2 </tspan>DEEP INHALE</text>

  <!-- 3: pause -->
  <g transform="translate(655,440)">
    <circle r="58" fill="none" stroke="#e3fbff" stroke-width="6" opacity="0.8"/>
    <rect x="-24" y="-28" width="16" height="56" rx="7" fill="#ffe08a"/>
    <rect x="8" y="-28" width="16" height="56" rx="7" fill="#ffe08a"/>
  </g>
  <text x="655" y="562" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">3 </tspan>PAUSE</text>

  <!-- 4: quick exhale (air out) -->
  <g transform="translate(245,450)">
    <path d="M-10 -40 C -52 -40 -66 6 -62 38 C -58 52 -36 54 -14 44 Z" fill="#8ee6a8" opacity="0.8"/>
    <path d="M10 -40 C 52 -40 66 6 62 38 C 58 52 36 54 14 44 Z" fill="#8ee6a8" opacity="0.8"/>
    <line x1="0" y1="-60" x2="0" y2="-26" stroke="#e3fbff" stroke-width="7" stroke-linecap="round"/>
    <line x1="-84" y1="-14" x2="-118" y2="-48" stroke="#8ee6a8" stroke-width="6" stroke-linecap="round" marker-end="url(#ag)"/>
    <line x1="84" y1="-14" x2="118" y2="-48" stroke="#8ee6a8" stroke-width="6" stroke-linecap="round" marker-end="url(#ag)"/>
  </g>
  <text x="245" y="562" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff"><tspan fill="#ffe08a">4 </tspan>QUICK EXHALE</text>

  <!-- timer -->
  <g transform="translate(300,670)">
    <circle r="44" fill="none" stroke="#ffe08a" stroke-width="6"/>
    <rect x="-10" y="-62" width="20" height="12" rx="4" fill="#ffe08a"/>
    <path d="M0 0 L0 -44 A44 44 0 0 1 38 22 Z" fill="#ffe08a" opacity="0.45"/>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="370" y="684" font-size="40" font-weight="800" fill="#ffe08a">4–7 SECONDS</text>
</svg>
