<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <marker id="ays" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <mask id="mm" maskUnits="userSpaceOnUse" x="-30" y="-30" width="60" height="60"><circle r="19" fill="#fff"/><circle cx="9" cy="-8" r="16" fill="#000"/></mask>
  </defs>

  <!-- ===== sleeper ===== -->
  <rect x="80" y="388" width="740" height="30" rx="15" fill="rgba(255,255,255,0.16)" stroke="#e3fbff" stroke-width="4"/>
  <ellipse cx="175" cy="364" rx="82" ry="26" fill="#3e8ea6" stroke="#e3fbff" stroke-width="4"/>
  <path d="M248 312 C 320 286 500 290 610 302 C 710 312 780 330 792 388 H 246 Z" fill="#5a5f9e" stroke="#c9b8ff" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="205" cy="324" r="48" fill="#3e8ea6" stroke="#e3fbff" stroke-width="5"/>
  <path d="M178 322 Q 190 332 202 322" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- brain with replay loop -->
  <g transform="translate(89 89) scale(0.3)">
    <path d="M215 300 C 200 210 270 125 390 105 C 510 85 645 110 720 180 C 770 228 772 300 740 345 C 715 378 680 388 640 382 C 600 378 570 388 540 400 C 500 418 430 425 380 412 C 335 400 310 375 300 345 C 275 345 235 335 215 300 Z"
          fill="#c9b8ff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
    <path d="M300 345 C 360 320 430 300 500 300 M470 98 C 455 160 470 220 452 290" fill="none" stroke="#7d6bc9" stroke-width="16" stroke-linecap="round"/>
  </g>
  <path d="M281 81 A 92 92 0 1 1 189 81" fill="none" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)"/>

  <text x="380" y="150" font-size="38" font-weight="800" fill="#ffe08a">REPLAY</text>
  <text x="380" y="200" font-size="30" font-weight="700" fill="#c9b8ff">NON-REM SLEEP</text>

  <!-- ===== calendar of nights ===== -->
  <rect x="100" y="470" width="700" height="240" rx="22" fill="rgba(255,255,255,0.08)" stroke="#e3fbff" stroke-width="5"/>
  <path d="M100 520 V492 Q100 470 122 470 H778 Q800 470 800 492 V520 Z" fill="rgba(227,251,255,0.25)"/>
  <text x="450" y="507" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SEVERAL NIGHTS</text>

  <g id="cells">
    <g fill="rgba(6,35,61,0.45)" stroke="rgba(227,251,255,0.6)" stroke-width="4">
      <rect x="120" y="538" width="150" height="152" rx="14"/>
      <rect x="290" y="538" width="150" height="152" rx="14"/>
      <rect x="460" y="538" width="150" height="152" rx="14"/>
      <rect x="630" y="538" width="150" height="152" rx="14"/>
    </g>
    <g font-size="28" font-weight="800" fill="#e3fbff">
      <text x="136" y="572">1</text><text x="306" y="572">2</text><text x="476" y="572">3</text><text x="646" y="572">4</text>
    </g>
    <!-- moons -->
    <g fill="#c9b8ff">
      <circle transform="translate(238 574)" r="19" mask="url(#mm)"/>
      <circle transform="translate(408 574)" r="19" mask="url(#mm)"/>
      <circle transform="translate(578 574)" r="19" mask="url(#mm)"/>
      <circle transform="translate(748 574)" r="19" mask="url(#mm)"/>
    </g>
    <!-- replay loops -->
    <g fill="none" stroke="#ffe08a" stroke-width="6" stroke-linecap="round">
      <path d="M210 621 A 30 30 0 1 1 180 621" marker-end="url(#ays)"/>
      <path d="M380 621 A 30 30 0 1 1 350 621" marker-end="url(#ays)"/>
      <path d="M550 621 A 30 30 0 1 1 520 621" marker-end="url(#ays)"/>
      <path d="M720 621 A 30 30 0 1 1 690 621" marker-end="url(#ays)"/>
    </g>
  </g>
</svg>
