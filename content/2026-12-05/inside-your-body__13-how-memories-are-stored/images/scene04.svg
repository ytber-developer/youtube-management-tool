<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <!-- ===== maze (top view) ===== -->
  <rect x="500" y="50" width="340" height="340" rx="14" fill="rgba(255,255,255,0.08)"/>
  <g fill="none" stroke="#e3fbff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer wall with entrance (bottom left) and goal (top right) -->
    <path d="M585 390 H840 V135"/>
    <path d="M840 50 H500 V390"/>
    <!-- inner walls -->
    <path d="M585 390 V305 H670"/>
    <path d="M500 220 H585 V135"/>
    <path d="M670 50 V135 H755"/>
    <path d="M670 220 V305"/>
    <path d="M755 220 H840"/>
    <path d="M585 220 H670"/>
    <path d="M755 305 V390"/>
  </g>
  <!-- path taken -->
  <path d="M542 410 V262 H627 V262 H712 V178 H797 V92" fill="none" stroke="#8ee6a8" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- goal: cheese -->
  <path d="M770 108 L822 80 L822 112 Z" fill="#ffe08a" stroke="#ffe08a" stroke-width="4" stroke-linejoin="round"/>
  <text x="670" y="440" font-size="30" font-weight="800" fill="#e3fbff" text-anchor="middle">MAZE</text>

  <!-- ===== rat (side view) ===== -->
  <!-- tail -->
  <path d="M650 610 C 720 650 790 640 840 560" fill="none" stroke="#ffb3a8" stroke-width="10" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="470" cy="575" rx="205" ry="108" fill="#9fb4c4" stroke="#ffffff" stroke-width="5"/>
  <!-- feet -->
  <g fill="#ffb3a8">
    <ellipse cx="400" cy="684" rx="34" ry="14"/>
    <ellipse cx="580" cy="684" rx="34" ry="14"/>
  </g>
  <!-- ear (behind head) -->
  <circle cx="335" cy="440" r="42" fill="#9fb4c4" stroke="#ffffff" stroke-width="5"/>
  <circle cx="335" cy="440" r="22" fill="#ffb3a8"/>
  <!-- head with snout -->
  <path d="M120 548 C 130 470 190 410 260 410 C 330 410 360 470 350 540 C 342 600 290 630 230 630 C 180 630 140 600 120 548 Z" fill="#9fb4c4" stroke="#ffffff" stroke-width="5"/>
  <path d="M130 520 C 100 535 80 548 70 560 C 90 572 120 575 140 572" fill="#9fb4c4" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="72" cy="560" r="9" fill="#ff8a7a"/>
  <circle cx="175" cy="525" r="9" fill="#06233d"/>

  <!-- brain inside head -->
  <ellipse cx="270" cy="490" rx="70" ry="44" fill="#e3fbff" stroke="#ffffff" stroke-width="4"/>
  <g fill="#ff8a7a">
    <circle cx="232" cy="482" r="13"/>
    <circle cx="276" cy="470" r="13"/>
    <circle cx="308" cy="502" r="13"/>
  </g>

  <!-- question marks -->
  <g font-size="48" font-weight="800" fill="#ffe08a" text-anchor="middle">
    <text x="190" y="390">?</text>
    <text x="276" y="370">?</text>
    <text x="400" y="390">?</text>
  </g>
  <g stroke="#ffe08a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9">
    <line x1="198" y1="402" x2="226" y2="466"/>
    <line x1="276" y1="384" x2="276" y2="454"/>
    <line x1="388" y1="402" x2="318" y2="488"/>
  </g>
</svg>
