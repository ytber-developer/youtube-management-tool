<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <!-- head and torso silhouette, facing right -->
  <path d="M260 340 C 205 300 195 200 235 140 C 275 82 365 72 412 108 C 450 138 460 172 458 198 L 488 252 C 492 262 484 268 470 268 L 470 292 C 470 302 476 308 470 316 C 464 324 460 326 462 336 C 464 352 450 362 426 360 L 404 358 L 400 400 C 450 410 500 440 508 520 L 515 715 L 150 715 L 160 520 C 168 440 210 410 268 400 Z" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="405" cy="170" r="8" fill="rgba(255,255,255,0.6)"/>

  <!-- airway: nose -> throat -> windpipe -> lung -->
  <path d="M380 262 C 362 290 352 320 346 360 L 338 490" fill="none" stroke="#e3fbff" stroke-width="16" stroke-linecap="round" opacity="0.7"/>

  <!-- lung (side view), warm core -->
  <path d="M338 486 C 282 486 242 546 240 612 C 238 668 262 700 300 700 L 396 700 C 428 700 440 668 438 612 C 436 546 392 486 338 486 Z" fill="rgba(255,138,122,0.55)" stroke="#ff8a7a" stroke-width="5"/>
  <g fill="none" stroke="#ffe3dd" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M338 500 L338 560 M338 540 L300 590 M338 540 L378 592 M300 590 L282 640 M300 590 L318 650 M378 592 L362 646 M378 592 L404 640"/>
  </g>

  <!-- nasal cavity, cool -->
  <path d="M474 262 C 452 222 402 212 372 226 C 358 238 360 262 378 270 C 412 278 448 274 474 262 Z" fill="#7fe3ff" stroke="#e3fbff" stroke-width="4"/>

  <!-- leaders -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="570" y1="200" x2="470" y2="244"/>
    <line x1="570" y1="560" x2="436" y2="590"/>
  </g>

  <!-- nose label + cool thermometer -->
  <text x="582" y="182" font-size="34" font-weight="800" fill="#7fe3ff">NOSE</text>
  <text x="582" y="238" font-size="46" font-weight="800" fill="#ffffff">≈ 33 °C</text>
  <text x="582" y="278" font-size="28" font-weight="700" fill="#7fe3ff">COOLER</text>
  <g transform="translate(815,0)">
    <rect x="-14" y="130" width="28" height="130" rx="14" fill="none" stroke="#e3fbff" stroke-width="5"/>
    <rect x="-6" y="215" width="12" height="50" rx="6" fill="#7fe3ff"/>
    <circle cx="0" cy="272" r="22" fill="#7fe3ff" stroke="#e3fbff" stroke-width="5"/>
  </g>

  <!-- lungs label + warm thermometer -->
  <text x="582" y="542" font-size="34" font-weight="800" fill="#ff8a7a">LUNGS</text>
  <text x="582" y="598" font-size="46" font-weight="800" fill="#ffffff">≈ 37 °C</text>
  <text x="582" y="638" font-size="28" font-weight="700" fill="#ff8a7a">CORE TEMP</text>
  <g transform="translate(815,0)">
    <rect x="-14" y="490" width="28" height="130" rx="14" fill="none" stroke="#e3fbff" stroke-width="5"/>
    <rect x="-6" y="505" width="12" height="120" rx="6" fill="#ff8a7a"/>
    <circle cx="0" cy="632" r="22" fill="#ff8a7a" stroke="#e3fbff" stroke-width="5"/>
  </g>
</svg>
