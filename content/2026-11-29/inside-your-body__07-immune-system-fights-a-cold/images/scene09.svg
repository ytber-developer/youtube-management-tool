<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <g id="v">
      <path d="M0 -17 L14.7 -8.5 L14.7 8.5 L0 17 L-14.7 8.5 L-14.7 -8.5 Z" fill="#ff8a7a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- neighbor cell with antiviral shield -->
    <g id="n">
      <circle r="82" fill="rgba(142,230,168,0.16)" stroke="#8ee6a8" stroke-width="5"/>
      <path d="M0 -40 L32 -28 L32 2 C32 24 16 38 0 46 C-16 38 -32 24 -32 2 L-32 -28 Z" fill="#8ee6a8"/>
      <path d="M-14 2 L-3 14 L16 -10" fill="none" stroke="#0a3f66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- signals: infected cell -> neighbors -->
  <g stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)">
    <line x1="362" y1="318" x2="262" y2="246"/>
    <line x1="538" y1="318" x2="638" y2="246"/>
    <line x1="362" y1="462" x2="262" y2="534"/>
    <line x1="538" y1="462" x2="638" y2="534"/>
  </g>
  <g fill="#ffe08a">
    <circle cx="322" cy="276" r="7"/><circle cx="296" cy="270" r="6"/>
    <circle cx="578" cy="276" r="7"/><circle cx="604" cy="270" r="6"/>
    <circle cx="322" cy="504" r="7"/><circle cx="296" cy="510" r="6"/>
    <circle cx="578" cy="504" r="7"/><circle cx="604" cy="510" r="6"/>
  </g>

  <!-- neighbors -->
  <use href="#n" x="180" y="185"/>
  <use href="#n" x="720" y="185"/>
  <use href="#n" x="180" y="595"/>
  <use href="#n" x="720" y="595"/>

  <!-- infected cell -->
  <circle cx="450" cy="390" r="105" fill="rgba(255,138,122,0.22)" stroke="#ff8a7a" stroke-width="6"/>
  <circle cx="450" cy="390" r="34" fill="rgba(255,255,255,0.18)" stroke="#ffd2cb" stroke-width="4"/>
  <use href="#v" x="400" y="335"/>
  <use href="#v" x="505" y="350"/>
  <use href="#v" x="398" y="440"/>
  <use href="#v" x="500" y="438"/>

  <!-- labels -->
  <text x="450" y="98" text-anchor="middle" font-size="34" font-weight="800" fill="#8ee6a8">ANTIVIRAL STATE</text>
  <text x="450" y="236" text-anchor="middle" font-size="32" font-weight="800" fill="#ffe08a">INTERFERONS</text>
  <text x="450" y="548" text-anchor="middle" font-size="32" font-weight="800" fill="#ff8a7a">INFECTED CELL</text>
</svg>
