</defs>
<g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" text-anchor="middle">
<line x1="60" y1="400" x2="850" y2="400" stroke="#ffffff" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/>
<!-- axis breaks -->
<g stroke="#c9c3ff" stroke-width="4" stroke-linecap="round">
<path d="M172,384 l-10,32 M186,384 l-10,32"/><path d="M352,384 l-10,32 M366,384 l-10,32"/>
<path d="M532,384 l-10,32 M546,384 l-10,32"/><path d="M712,384 l-10,32 M726,384 l-10,32"/>
</g>
<g fill="#ffb347"><circle cx="90" cy="400" r="12"/><circle cx="270" cy="400" r="12"/><circle cx="450" cy="400" r="12"/><circle cx="630" cy="400" r="12"/><circle cx="810" cy="400" r="12"/></g>
<!-- icons -->
<circle cx="90" cy="290" r="46" fill="url(#sun)"/><circle cx="90" cy="290" r="26" fill="#ffd34d"/>
<circle cx="270" cy="290" r="60" fill="url(#sun)"/><circle cx="270" cy="290" r="34" fill="#ffe680"/>
<circle cx="450" cy="290" r="34" fill="url(#red)"/><circle cx="450" cy="290" r="16" fill="#ff6a3d"/>
<circle cx="630" cy="290" r="40" fill="none" stroke="#ffb347" stroke-width="6" opacity="0.8"/><circle cx="630" cy="290" r="28" fill="#05040f" stroke="#c9c3ff" stroke-width="4"/>
<circle cx="810" cy="290" r="34" fill="none" stroke="#c9c3ff" stroke-width="4" stroke-dasharray="6 10" opacity="0.7"/>
<circle cx="800" cy="282" r="3" fill="#ffffff" opacity="0.6"/><circle cx="822" cy="300" r="3" fill="#ffffff" opacity="0.6"/>
