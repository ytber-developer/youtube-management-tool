<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7fe3ff"/>
    </marker>
  </defs>

  <!-- brain cell interior + membrane -->
  <rect x="40" y="350" width="820" height="370" rx="40" fill="rgba(255,255,255,0.07)"/>
  <rect x="40" y="330" width="820" height="40" rx="20" fill="rgba(227,251,255,0.28)"/>
  <text x="450" y="700" text-anchor="middle" font-size="28" font-weight="700" fill="rgba(227,251,255,0.8)">BRAIN CELL</text>

  <!-- ===== LEFT: adenosine key ===== -->
  <text x="260" y="88" text-anchor="middle" font-size="34" font-weight="800" fill="#7fe3ff">ADENOSINE</text>
  <g fill="#7fe3ff" stroke="#ffffff" stroke-width="4">
    <rect x="250" y="200" width="20" height="125" rx="6"/>
    <rect x="270" y="262" width="18" height="14" rx="3" stroke="none"/>
    <rect x="270" y="290" width="14" height="14" rx="3" stroke="none"/>
    <circle cx="260" cy="165" r="44"/>
  </g>
  <circle cx="260" cy="165" r="15" fill="#0a3f66"/>
  <!-- lock (receptor) -->
  <rect x="190" y="285" width="140" height="135" rx="26" fill="#0f6f8f" stroke="#7fe3ff" stroke-width="6"/>
  <rect x="249" y="285" width="22" height="40" fill="#7fe3ff"/>
  <circle cx="260" cy="365" r="14" fill="#ffe08a"/>
  <!-- tired signal -->
  <path d="M260 432 q-16 18 0 36 q16 18 0 36 q-16 18 0 36" fill="none" stroke="#7fe3ff" stroke-width="7" stroke-linecap="round" marker-end="url(#ac)"/>
  <text x="260" y="630" text-anchor="middle" font-size="32" font-weight="800" fill="#7fe3ff">TIRED SIGNAL</text>

  <!-- ===== RIGHT: caffeine key ===== -->
  <text x="680" y="88" text-anchor="middle" font-size="34" font-weight="800" fill="#ffe08a">CAFFEINE</text>
  <g fill="#ffe08a" stroke="#ffffff" stroke-width="4">
    <rect x="670" y="200" width="20" height="125" rx="6"/>
    <rect x="690" y="262" width="18" height="14" rx="3" stroke="none"/>
    <rect x="690" y="290" width="14" height="14" rx="3" stroke="none"/>
    <path d="M680 117 L722 141 L722 189 L680 213 L638 189 L638 141 Z" stroke-linejoin="round"/>
  </g>
  <circle cx="680" cy="165" r="15" fill="#0a3f66"/>
  <!-- lock (receptor), quiet -->
  <rect x="610" y="285" width="140" height="135" rx="26" fill="#0f6f8f" stroke="#7fe3ff" stroke-width="6"/>
  <rect x="669" y="285" width="22" height="40" fill="#ffe08a"/>
  <circle cx="680" cy="365" r="14" fill="rgba(227,251,255,0.35)"/>
  <!-- blocked signal -->
  <path d="M680 432 q-16 18 0 36 q16 18 0 36 q-16 18 0 36" fill="none" stroke="#7fe3ff" stroke-width="7" stroke-linecap="round" opacity="0.25"/>
  <g stroke="#ff8a7a" stroke-width="10" stroke-linecap="round">
    <line x1="648" y1="456" x2="712" y2="520"/>
    <line x1="712" y1="456" x2="648" y2="520"/>
  </g>
  <text x="680" y="630" text-anchor="middle" font-size="32" font-weight="800" fill="#ff8a7a">NO SIGNAL</text>

  <!-- shared label -->
  <text x="470" y="250" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">RECEPTOR</text>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="400" y1="262" x2="338" y2="300"/>
    <line x1="540" y1="262" x2="602" y2="300"/>
  </g>
</svg>
