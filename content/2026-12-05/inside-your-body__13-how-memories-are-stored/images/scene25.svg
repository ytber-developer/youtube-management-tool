<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e3fbff"/>
    </marker>
  </defs>

  <!-- converging arrows: pieces coming back together -->
  <g fill="none" stroke="#e3fbff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M70 100 C 110 120 150 150 180 180" marker-end="url(#aw)"/>
    <path d="M70 680 C 110 660 150 630 180 600" marker-end="url(#aw)"/>
    <path d="M830 100 C 790 120 750 150 720 180" marker-end="url(#aw)"/>
  </g>

  <g transform="translate(20 40)">
    <!-- ghost of the original piece -->
    <path d="M400 340 H470 a30 30 0 1 0 60 0 H600 V540 H400 V470 a30 30 0 1 0 0 -60 Z"
          fill="none" stroke="#ffe08a" stroke-width="4" stroke-dasharray="8 8" opacity="0.8"/>

    <!-- SIGHT -->
    <path d="M200 140 H400 V210 a30 30 0 1 1 0 60 V340 H330 a30 30 0 1 1 -60 0 H200 Z" fill="#7fe3ff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M262 222 Q 300 190 338 222 Q 300 254 262 222 Z" fill="none" stroke="#06233d" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="300" cy="222" r="11" fill="#06233d"/>
    <text x="300" y="296" font-size="30" font-weight="800" fill="#06233d" text-anchor="middle">SIGHT</text>

    <!-- SOUND -->
    <path d="M400 140 H600 V340 H530 a30 30 0 1 1 -60 0 H400 V270 a30 30 0 1 0 0 -60 Z" fill="#c9b8ff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#06233d">
      <ellipse cx="488" cy="240" rx="15" ry="11"/>
      <ellipse cx="528" cy="230" rx="15" ry="11"/>
    </g>
    <path d="M501 238 V194 L 541 186 V228" fill="none" stroke="#06233d" stroke-width="6" stroke-linejoin="round"/>
    <text x="510" y="296" font-size="30" font-weight="800" fill="#06233d" text-anchor="middle">SOUND</text>

    <!-- EMOTION -->
    <path d="M200 340 H270 a30 30 0 1 0 60 0 H400 V410 a30 30 0 1 1 0 60 V540 H200 Z" fill="#8ee6a8" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M300 456 C 270 436 262 412 278 400 C 290 391 300 400 300 408 C 300 400 310 391 322 400 C 338 412 330 436 300 456 Z" fill="#06233d"/>
    <text x="300" y="500" font-size="30" font-weight="800" fill="#06233d" text-anchor="middle">EMOTION</text>

    <!-- PLACE: slightly altered piece -->
    <g transform="translate(22 18) rotate(7 500 440)">
      <path d="M400 340 H470 a30 30 0 1 0 60 0 H600 V540 H400 V470 a30 30 0 1 0 0 -60 Z" fill="#ffb86b" stroke="#ff8a7a" stroke-width="6" stroke-linejoin="round"/>
      <path d="M510 452 C 490 428 482 414 482 402 A 28 28 0 0 1 538 402 C 538 414 530 428 510 452 Z" fill="#06233d"/>
      <circle cx="510" cy="402" r="9" fill="#ffb86b"/>
      <text x="510" y="500" font-size="30" font-weight="800" fill="#06233d" text-anchor="middle">PLACE</text>
    </g>
  </g>

  <!-- label -->
  <text x="700" y="640" font-size="32" font-weight="800" fill="#ff8a7a">SMALL</text>
  <text x="700" y="678" font-size="32" font-weight="800" fill="#ff8a7a">ERROR</text>
  <line x1="694" y1="626" x2="660" y2="604" stroke="#ff8a7a" stroke-width="4" stroke-linecap="round"/>
</svg>
