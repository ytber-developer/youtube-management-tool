<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
<radialGradient id="sun"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.6" stop-color="#ffd34d"/><stop offset="1" stop-color="#ffd34d" stop-opacity="0"/></radialGradient>
