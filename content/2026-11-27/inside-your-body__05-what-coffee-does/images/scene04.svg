<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff8a7a"/>
    </marker>
  </defs>

  <!-- body silhouette -->
  <g fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.35)" stroke-width="4">
    <rect x="200" y="270" width="240" height="440" rx="80"/>
    <rect x="290" y="232" width="60" height="50" rx="10" stroke="none"/>
    <circle cx="320" cy="150" r="98"/>
  </g>

  <!-- brain + blood-brain barrier -->
  <ellipse cx="320" cy="122" rx="78" ry="58" fill="none" stroke="#ffe08a" stroke-width="5" stroke-dasharray="12 9"/>
  <path d="M258 128 C250 92 285 76 305 84 C318 70 350 72 360 88 C384 88 392 116 380 132 C386 152 360 166 340 158 C326 170 300 168 292 158 C268 164 250 148 258 128 Z" fill="#e3fbff" opacity="0.9"/>
  <path d="M290 110 q12 10 26 0 M318 132 q14 8 30 -2 M300 140 q-4 -14 -16 -14" fill="none" stroke="#0f6f8f" stroke-width="4" stroke-linecap="round"/>

  <!-- mouth -->
  <path d="M300 206 Q320 222 340 206" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- stomach -->
  <path d="M332 330 C350 318 400 320 405 360 C410 400 372 430 330 420 C306 414 300 394 318 386 C340 378 350 370 338 352 Z" fill="#8ee6a8" opacity="0.75"/>
  <!-- small intestine (coiled) -->
  <path d="M310 470 C250 470 250 505 300 505 C350 505 370 505 370 520 C370 540 250 530 250 555 C250 580 360 572 370 590 C378 606 300 610 280 600" fill="none" stroke="#8ee6a8" stroke-width="16" stroke-linecap="round" opacity="0.75"/>

  <!-- caffeine path through the gut -->
  <path d="M320 222 L322 300 C324 318 332 328 345 335" fill="none" stroke="#ffe08a" stroke-width="6" stroke-dasharray="3 12" stroke-linecap="round" marker-end="url(#ay)"/>
  <path d="M345 420 C330 445 320 455 312 466" fill="none" stroke="#ffe08a" stroke-width="6" stroke-dasharray="3 12" stroke-linecap="round" marker-end="url(#ay)"/>

  <!-- bloodstream up to the brain -->
  <path d="M372 520 L410 520 Q425 520 425 505 L425 300 Q425 270 395 262 L370 255 Q360 252 360 240 L360 150" fill="none" stroke="#ff8a7a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
  <g fill="#ffe08a">
    <circle cx="425" cy="460" r="7"/>
    <circle cx="425" cy="390" r="7"/>
    <circle cx="425" cy="320" r="7"/>
    <circle cx="360" cy="215" r="7"/>
  </g>

  <!-- labels -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="490" y1="96" x2="392" y2="110"/>
    <line x1="490" y1="166" x2="400" y2="150"/>
    <line x1="196" y1="210" x2="292" y2="210"/>
    <line x1="490" y1="376" x2="408" y2="370"/>
    <line x1="490" y1="456" x2="432" y2="456"/>
    <line x1="490" y1="566" x2="378" y2="580"/>
  </g>
  <g font-size="30" font-weight="800">
    <text x="500" y="106" fill="#e3fbff">BRAIN</text>
    <text x="500" y="176" fill="#ffe08a">BLOOD-BRAIN BARRIER</text>
    <text x="184" y="221" fill="#ffffff" text-anchor="end">MOUTH</text>
    <text x="500" y="386" fill="#8ee6a8">STOMACH</text>
    <text x="500" y="466" fill="#ff8a7a">BLOODSTREAM</text>
    <text x="500" y="576" fill="#8ee6a8">SMALL INTESTINE</text>
  </g>
  <circle cx="512" cy="650" r="10" fill="#ffe08a"/>
  <text x="534" y="661" font-size="30" font-weight="700" fill="#ffe08a">CAFFEINE</text>
</svg>
