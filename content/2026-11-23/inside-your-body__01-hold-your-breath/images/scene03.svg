<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e3fbff"/>
    </marker>
  </defs>

  <!-- chart panel -->
  <rect x="90" y="110" width="660" height="390" rx="24" fill="rgba(255,255,255,0.06)"/>

  <!-- axes -->
  <line x1="110" y1="120" x2="110" y2="490" stroke="#e3fbff" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="490" x2="790" y2="490" stroke="#e3fbff" stroke-width="5" stroke-linecap="round" marker-end="url(#ax)"/>
  <text x="790" y="532" text-anchor="end" font-size="26" font-weight="600" fill="#e3fbff">TIME</text>

  <!-- oxygen: slow fall -->
  <path d="M112 170 C 350 178, 540 215, 700 280" fill="none" stroke="#7fe3ff" stroke-width="8" stroke-linecap="round"/>
  <!-- carbon dioxide: rising -->
  <path d="M112 450 C 380 440, 560 330, 700 150" fill="none" stroke="#ff8a7a" stroke-width="8" stroke-linecap="round"/>

  <circle cx="700" cy="150" r="11" fill="#ff8a7a"/>
  <circle cx="700" cy="280" r="11" fill="#7fe3ff"/>

  <text x="160" y="228" font-size="36" font-weight="800" fill="#7fe3ff">O<tspan font-size="24" dy="8">2</tspan><tspan dy="-8" font-size="30" font-weight="600"> falls slowly</tspan></text>
  <text x="360" y="438" font-size="36" font-weight="800" fill="#ff8a7a">CO<tspan font-size="24" dy="8">2</tspan><tspan dy="-8" font-size="30" font-weight="600"> builds up</tspan></text>

  <!-- diaphragm signals: growing pulses -->
  <g fill="#ffe08a">
    <rect x="128" y="638" width="16" height="12" rx="6"/>
    <rect x="168" y="634" width="16" height="16" rx="7"/>
    <rect x="208" y="630" width="16" height="20" rx="8"/>
    <rect x="248" y="625" width="16" height="25" rx="8"/>
    <rect x="288" y="619" width="16" height="31" rx="8"/>
    <rect x="328" y="612" width="16" height="38" rx="8"/>
    <rect x="368" y="604" width="16" height="46" rx="8"/>
    <rect x="408" y="595" width="16" height="55" rx="8"/>
    <rect x="448" y="585" width="16" height="65" rx="8"/>
    <rect x="488" y="574" width="16" height="76" rx="8"/>
    <rect x="528" y="563" width="16" height="87" rx="8"/>
    <rect x="568" y="555" width="16" height="95" rx="8"/>
    <rect x="608" y="550" width="16" height="100" rx="8"/>
    <rect x="648" y="546" width="16" height="104" rx="8"/>
  </g>
  <line x1="110" y1="650" x2="700" y2="650" stroke="#ffe08a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <text x="110" y="700" font-size="30" font-weight="700" fill="#ffe08a">DIAPHRAGM SIGNALS</text>

  <!-- breaking point -->
  <line x1="700" y1="120" x2="700" y2="660" stroke="#ffffff" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/>
  <text x="700" y="88" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">BREAKING POINT</text>
</svg>
