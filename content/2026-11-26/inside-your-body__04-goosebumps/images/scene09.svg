<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <clipPath id="sk"><rect x="40" y="150" width="400" height="550"/></clipPath>
    <marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffe08a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8ee6a8"/>
    </marker>
  </defs>

  <!-- skin block -->
  <path d="M40 150 H440 V670 Q440 700 410 700 H70 Q40 700 40 670 Z" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>
  <rect x="40" y="150" width="400" height="40" fill="rgba(255,224,138,0.35)"/>
  <line x1="40" y1="150" x2="440" y2="150" stroke="#ffe08a" stroke-width="5"/>

  <!-- follicle + hair -->
  <line x1="234" y1="120" x2="190" y2="560" stroke="rgba(227,251,255,0.35)" stroke-width="44" stroke-linecap="round" clip-path="url(#sk)"/>
  <ellipse cx="190" cy="560" rx="32" ry="28" fill="#e3fbff" opacity="0.7"/>
  <line x1="191" y1="550" x2="241" y2="62" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- arrector pili muscle -->
  <ellipse cx="299" cy="268" rx="91" ry="16" transform="rotate(-47.9 299 268)" fill="#ffe08a" stroke="#ffffff" stroke-width="4"/>

  <!-- stem cells at the bulge -->
  <g fill="#8ee6a8" stroke="#ffffff" stroke-width="3">
    <circle cx="192" cy="325" r="13"/>
    <circle cx="189" cy="360" r="13"/>
    <circle cx="186" cy="395" r="13"/>
    <circle cx="232" cy="370" r="13"/>
    <circle cx="229" cy="405" r="13"/>
  </g>

  <!-- sympathetic nerve: wraps stem cells, runs along the muscle -->
  <path d="M410 690 C 360 640, 300 600, 290 520 C 284 470, 262 440, 246 415 C 236 400, 250 370, 268 340 C 290 300, 320 260, 350 222" fill="none" stroke="#7fe3ff" stroke-width="7" stroke-linecap="round"/>
  <path d="M246 415 C 222 432, 176 425, 170 395" fill="none" stroke="#7fe3ff" stroke-width="6" stroke-linecap="round"/>

  <!-- labels on the skin -->
  <text x="320" y="110" font-size="30" font-weight="800" fill="#ffe08a">MUSCLE</text>
  <line x1="360" y1="122" x2="340" y2="220" stroke="#ffe08a" stroke-width="4" stroke-linecap="round"/>

  <text x="60" y="440" font-size="28" font-weight="800" fill="#8ee6a8">STEM</text>
  <text x="60" y="474" font-size="28" font-weight="800" fill="#8ee6a8">CELLS</text>

  <text x="300" y="660" text-anchor="end" font-size="30" font-weight="800" fill="#7fe3ff">NERVE</text>

  <!-- outcome arrows -->
  <line x1="372" y1="250" x2="466" y2="210" stroke="#ffe08a" stroke-width="7" stroke-linecap="round" marker-end="url(#ay)"/>
  <line x1="272" y1="398" x2="466" y2="480" stroke="#8ee6a8" stroke-width="7" stroke-linecap="round" marker-end="url(#ag)"/>

  <!-- card 1: short-term -->
  <rect x="490" y="110" width="370" height="190" rx="28" fill="rgba(255,255,255,0.10)" stroke="#ffe08a" stroke-width="4"/>
  <circle cx="540" cy="166" r="24" fill="#ffe08a"/>
  <text x="540" y="177" text-anchor="middle" font-size="30" font-weight="800" fill="#0a3f66">1</text>
  <text x="580" y="177" font-size="30" font-weight="700" fill="#e3fbff">SHORT COLD</text>
  <text x="520" y="255" font-size="38" font-weight="800" fill="#ffe08a">GOOSEBUMPS</text>

  <!-- card 2: prolonged -->
  <rect x="490" y="400" width="370" height="190" rx="28" fill="rgba(255,255,255,0.10)" stroke="#8ee6a8" stroke-width="4"/>
  <circle cx="540" cy="456" r="24" fill="#8ee6a8"/>
  <text x="540" y="467" text-anchor="middle" font-size="30" font-weight="800" fill="#0a3f66">2</text>
  <text x="580" y="467" font-size="30" font-weight="700" fill="#e3fbff">LONG COLD</text>
  <text x="520" y="545" font-size="38" font-weight="800" fill="#8ee6a8">NEW HAIR</text>
</svg>
