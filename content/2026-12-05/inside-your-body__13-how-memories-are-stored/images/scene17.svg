<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <radialGradient id="beam" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="zoom"><circle cx="690" cy="245" r="146"/></clipPath>
  </defs>

  <!-- ===== new box ===== -->
  <rect x="60" y="400" width="460" height="300" rx="20" fill="rgba(255,255,255,0.08)" stroke="#e3fbff" stroke-width="5"/>
  <line x1="60" y1="660" x2="520" y2="660" stroke="rgba(227,251,255,0.5)" stroke-width="4"/>
  <text x="84" y="446" font-size="28" font-weight="700" fill="#e3fbff">NEW BOX</text>

  <!-- light source + fiber -->
  <rect x="356" y="84" width="100" height="62" rx="14" fill="rgba(127,227,255,0.25)" stroke="#7fe3ff" stroke-width="5"/>
  <text x="336" y="126" font-size="30" font-weight="800" fill="#7fe3ff" text-anchor="end">LIGHT</text>
  <line x1="406" y1="146" x2="406" y2="560" stroke="#7fe3ff" stroke-width="6" stroke-linecap="round"/>

  <!-- mouse, frozen in a crouch -->
  <path d="M196 640 C 150 650 120 680 84 676" fill="none" stroke="#ffb3a8" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="300" cy="618" rx="112" ry="58" fill="#c7d3dc" stroke="#ffffff" stroke-width="5"/>
  <circle cx="384" cy="562" r="24" fill="#c7d3dc" stroke="#ffffff" stroke-width="5"/>
  <circle cx="384" cy="562" r="11" fill="#ffb3a8"/>
  <path d="M370 580 C 400 570 440 585 468 612 C 440 630 400 636 372 628 Z" fill="#c7d3dc" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="468" cy="612" r="7" fill="#ff8a7a"/>
  <circle cx="418" cy="596" r="6" fill="#06233d"/>
  <g fill="#ffb3a8"><ellipse cx="260" cy="672" rx="26" ry="10"/><ellipse cx="370" cy="660" rx="22" ry="9"/></g>
  <!-- glow at fiber tip -->
  <circle cx="406" cy="566" r="30" fill="url(#beam)"/>

  <!-- ===== zoom bubble: tagged neurons ===== -->
  <path d="M424 556 L 568 330" stroke="#e3fbff" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round"/>
  <circle cx="690" cy="245" r="146" fill="rgba(6,35,61,0.5)"/>
  <g clip-path="url(#zoom)">
    <!-- light cone -->
    <path d="M600 90 L 540 400 L 840 400 L 690 90 Z" fill="rgba(127,227,255,0.22)"/>
    <!-- untagged neurons -->
    <g fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round">
      <circle cx="600" cy="200" r="16"/><path d="M584 200 H560 M610 188 L622 170" fill="none"/>
      <circle cx="790" cy="190" r="16"/><path d="M806 190 H830 M780 178 L770 160" fill="none"/>
      <circle cx="610" cy="320" r="16"/><path d="M596 330 L580 348" fill="none"/>
      <circle cx="790" cy="315" r="16"/><path d="M804 324 L822 340" fill="none"/>
    </g>
    <!-- tagged, light-activated neurons -->
    <g fill="#ffe08a" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <circle cx="680" cy="210" r="20"/>
      <circle cx="730" cy="268" r="20"/>
      <circle cx="660" cy="292" r="20"/>
    </g>
    <g fill="none" stroke="#ffe08a" stroke-width="5" stroke-linecap="round">
      <path d="M696 222 L 716 252"/>
      <path d="M672 276 L 676 228"/>
      <path d="M710 274 L 680 288"/>
    </g>
  </g>
  <circle cx="690" cy="245" r="146" fill="none" stroke="#ffffff" stroke-width="5"/>
  <text x="690" y="440" font-size="30" font-weight="800" fill="#ffe08a" text-anchor="middle">TAGGED CELLS</text>

  <!-- outcome labels -->
  <text x="560" y="560" font-size="32" font-weight="800" fill="#ffffff">FREEZES</text>
  <line x1="556" y1="570" x2="480" y2="600" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- no shock -->
  <circle cx="590" cy="652" r="30" fill="none" stroke="#ff8a7a" stroke-width="5"/>
  <path d="M596 628 L 580 654 H 598 L 584 678" fill="none" stroke="#ffe08a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="569" y1="631" x2="611" y2="673" stroke="#ff8a7a" stroke-width="5" stroke-linecap="round"/>
  <text x="636" y="664" font-size="30" font-weight="800" fill="#ff8a7a">NO SHOCK</text>
</svg>
