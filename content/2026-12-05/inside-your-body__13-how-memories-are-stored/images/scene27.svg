<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7fe3ff"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff8a7a"/>
    </marker>
  </defs>

  <!-- ===== SMASHED ===== -->
  <path d="M90 80 Q90 60 110 60 H340 Q360 60 360 80 V150 Q360 170 340 170 H250 L225 200 L200 170 H110 Q90 170 90 150 Z" fill="rgba(255,138,122,0.25)" stroke="#ff8a7a" stroke-width="5" stroke-linejoin="round"/>
  <text x="225" y="128" font-size="38" font-weight="800" fill="#ff8a7a" text-anchor="middle">“SMASHED”</text>
  <line x1="225" y1="222" x2="225" y2="280" stroke="#ff8a7a" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/>

  <path d="M75 470 A150 150 0 0 1 375 470" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="20" stroke-linecap="round"/>
  <path d="M75 470 A150 150 0 0 1 306.8 344.2" fill="none" stroke="#ff8a7a" stroke-width="20" stroke-linecap="round"/>
  <line x1="225" y1="470" x2="290.4" y2="369.3" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="225" cy="470" r="16" fill="#ffffff"/>
  <g font-size="26" font-weight="700" fill="#e3fbff" text-anchor="middle">
    <text x="75" y="514">0</text>
    <text x="375" y="514">60</text>
  </g>
  <text x="225" y="590" font-size="40" font-weight="800" fill="#ff8a7a" text-anchor="middle">≈41 MPH</text>

  <!-- ===== CONTACTED ===== -->
  <path d="M520 80 Q520 60 540 60 H810 Q830 60 830 80 V150 Q830 170 810 170 H700 L675 200 L650 170 H540 Q520 170 520 150 Z" fill="rgba(127,227,255,0.2)" stroke="#7fe3ff" stroke-width="5" stroke-linejoin="round"/>
  <text x="675" y="128" font-size="38" font-weight="800" fill="#7fe3ff" text-anchor="middle">“CONTACTED”</text>
  <line x1="675" y1="222" x2="675" y2="280" stroke="#7fe3ff" stroke-width="5" stroke-linecap="round" marker-end="url(#ac)"/>

  <path d="M525 470 A150 150 0 0 1 825 470" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="20" stroke-linecap="round"/>
  <path d="M525 470 A150 150 0 0 1 690.8 320.8" fill="none" stroke="#7fe3ff" stroke-width="20" stroke-linecap="round"/>
  <line x1="675" y1="470" x2="687.6" y2="350.6" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="675" cy="470" r="16" fill="#ffffff"/>
  <g font-size="26" font-weight="700" fill="#e3fbff" text-anchor="middle">
    <text x="525" y="514">0</text>
    <text x="825" y="514">60</text>
  </g>
  <text x="675" y="590" font-size="40" font-weight="800" fill="#7fe3ff" text-anchor="middle">≈32 MPH</text>

  <!-- comparison -->
  <text x="225" y="660" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">HIGHER</text>
  <text x="675" y="660" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">LOWER</text>
</svg>
