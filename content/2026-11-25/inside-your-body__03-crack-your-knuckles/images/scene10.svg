<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <text x="450" y="80" text-anchor="middle" font-size="34" font-weight="800" fill="#e3fbff">HAND ARTHRITIS</text>

  <!-- gridlines (0, 10, 20 %) -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="4">
    <line x1="140" y1="416" x2="780" y2="416"/>
    <line x1="140" y1="232" x2="780" y2="232"/>
  </g>
  <g font-size="26" font-weight="600" fill="rgba(227,251,255,0.75)" text-anchor="end">
    <text x="122" y="609">0%</text>
    <text x="122" y="425">10%</text>
    <text x="122" y="241">20%</text>
  </g>

  <!-- bars: scale 18.4 px per % from baseline 600 -->
  <rect x="200" y="269" width="200" height="331" rx="18" fill="#ffe08a"/>
  <rect x="520" y="195" width="200" height="405" rx="18" fill="#7fe3ff"/>
  <line x1="140" y1="600" x2="780" y2="600" stroke="#e3fbff" stroke-width="5" stroke-linecap="round"/>

  <text x="300" y="330" text-anchor="middle" font-size="46" font-weight="800" fill="#0a3f66">~18%</text>
  <text x="620" y="256" text-anchor="middle" font-size="46" font-weight="800" fill="#0a3f66">~22%</text>

  <text x="300" y="648" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">CRACKERS</text>
  <text x="620" y="648" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">NON-CRACKERS</text>

  <rect x="355" y="676" width="190" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)" stroke-width="4"/>
  <text x="450" y="710" text-anchor="middle" font-size="26" font-weight="700" fill="#e3fbff">2011 STUDY</text>
</svg>
