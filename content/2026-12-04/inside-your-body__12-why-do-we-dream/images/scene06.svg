<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="al" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c9b8ff"/>
    </marker>
  </defs>

  <!-- stage grid lines -->
  <g stroke="rgba(255,255,255,0.14)" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round">
    <line x1="190" y1="190" x2="850" y2="190"/>
    <line x1="190" y1="270" x2="850" y2="270"/>
    <line x1="190" y1="350" x2="850" y2="350"/>
    <line x1="190" y1="430" x2="850" y2="430"/>
    <line x1="190" y1="510" x2="850" y2="510"/>
  </g>

  <!-- stage labels -->
  <g font-size="28" font-weight="700" text-anchor="end">
    <text x="170" y="200" fill="#ffffff">AWAKE</text>
    <text x="170" y="280" fill="#c9b8ff" font-weight="800">REM</text>
    <text x="170" y="360" fill="#e3fbff">STAGE 1</text>
    <text x="170" y="440" fill="#e3fbff">STAGE 2</text>
    <text x="170" y="520" fill="#8ee6a8" font-weight="800">STAGE 3</text>
  </g>

  <!-- hypnogram trace (8 hours, 5 cycles) -->
  <path d="M190 190 H197 V350 H207 V430 H231 V510 H279 V430 H300 V270 H314 V430 H341 V510 H383 V430 H417 V270 H444 V350 H451 V430 H499 V510 H513 V430 H534 V270 H575 V430 H644 V270 H699 V350 H706 V430 H768 V270 H836 V190 H850"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- deep sleep blocks (early in the night) -->
  <g fill="#8ee6a8">
    <rect x="231" y="496" width="48" height="28" rx="10"/>
    <rect x="341" y="496" width="42" height="28" rx="10"/>
    <rect x="499" y="496" width="14" height="28" rx="6"/>
  </g>

  <!-- REM blocks (longer toward morning: ~10, 20, 30, 40, 50 min) -->
  <g fill="#c9b8ff">
    <rect x="300" y="256" width="14" height="28" rx="6"/>
    <rect x="417" y="256" width="27" height="28" rx="8"/>
    <rect x="534" y="256" width="41" height="28" rx="10"/>
    <rect x="644" y="256" width="55" height="28" rx="10"/>
    <rect x="768" y="256" width="68" height="28" rx="10"/>
  </g>

  <!-- x axis -->
  <line x1="190" y1="560" x2="850" y2="560" stroke="#e3fbff" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#e3fbff" stroke-width="4">
    <line x1="190" y1="560" x2="190" y2="574"/>
    <line x1="355" y1="560" x2="355" y2="574"/>
    <line x1="520" y1="560" x2="520" y2="574"/>
    <line x1="685" y1="560" x2="685" y2="574"/>
    <line x1="850" y1="560" x2="850" y2="574"/>
  </g>
  <g font-size="28" font-weight="700" fill="#e3fbff" text-anchor="middle">
    <text x="190" y="610">0</text>
    <text x="355" y="610">2</text>
    <text x="520" y="610">4</text>
    <text x="685" y="610">6</text>
    <text x="850" y="610">8</text>
  </g>
  <text x="520" y="656" font-size="28" font-weight="700" fill="#7fe3ff" text-anchor="middle" letter-spacing="2">HOURS ASLEEP</text>

  <!-- cycle bracket -->
  <path d="M192 140 V124 H312 V140" fill="none" stroke="#ffe08a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="190" y="102" font-size="30" font-weight="800" fill="#ffe08a">1 CYCLE ≈ 90 MIN</text>

  <!-- REM annotation -->
  <text x="850" y="102" font-size="30" font-weight="800" fill="#c9b8ff" text-anchor="end">REM GETS LONGER</text>
  <path d="M760 122 C 770 170 790 200 798 238" fill="none" stroke="#c9b8ff" stroke-width="5" stroke-linecap="round" marker-end="url(#al)"/>

  <!-- legend -->
  <rect x="210" y="696" width="44" height="26" rx="8" fill="#8ee6a8"/>
  <text x="268" y="719" font-size="28" font-weight="700" fill="#8ee6a8">DEEP SLEEP</text>
  <rect x="540" y="696" width="44" height="26" rx="8" fill="#c9b8ff"/>
  <text x="598" y="719" font-size="28" font-weight="700" fill="#c9b8ff">REM</text>
</svg>
