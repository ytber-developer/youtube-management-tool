<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffffff"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7fe3ff"/>
    </marker>
    <g id="v">
      <path d="M0 -24 L20.8 -12 L20.8 12 L0 24 L-20.8 12 L-20.8 -12 Z" fill="#ff8a7a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -24 L0 0 M20.8 12 L0 0 M-20.8 12 L0 0" stroke="#ffd2cb" stroke-width="3"/>
    </g>
    <!-- antibody: arms point up (-y) -->
    <g id="ab" fill="none" stroke="#ffe08a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 22 L0 0 M0 0 L-14 -18 M0 0 L14 -18"/>
    </g>
  </defs>

  <!-- ===== T cell attacks an infected cell ===== -->
  <circle cx="190" cy="175" r="72" fill="rgba(127,227,255,0.30)" stroke="#7fe3ff" stroke-width="6"/>
  <circle cx="180" cy="168" r="38" fill="rgba(127,227,255,0.55)"/>
  <g stroke="#7fe3ff" stroke-width="5" stroke-linecap="round">
    <path d="M262 175 h14 M255 140 l12 -6 M255 210 l12 6"/>
  </g>
  <line x1="294" y1="175" x2="462" y2="175" stroke="#7fe3ff" stroke-width="9" stroke-linecap="round" marker-end="url(#ac)"/>
  <!-- infected cell -->
  <circle cx="600" cy="175" r="104" fill="rgba(255,138,122,0.20)" stroke="#ff8a7a" stroke-width="6" stroke-dasharray="20 10"/>
  <circle cx="600" cy="175" r="30" fill="rgba(255,255,255,0.16)" stroke="#ffd2cb" stroke-width="4"/>
  <use href="#v" transform="translate(548 128) scale(0.7)"/>
  <use href="#v" transform="translate(655 135) scale(0.7)"/>
  <use href="#v" transform="translate(560 228) scale(0.7)"/>
  <use href="#v" transform="translate(650 222) scale(0.7)"/>
  <!-- hit marks -->
  <g stroke="#ffe08a" stroke-width="6" stroke-linecap="round">
    <path d="M478 128 l-14 -16 M478 222 l-14 16 M470 175 h-2"/>
  </g>
  <text x="190" y="298" text-anchor="middle" font-size="32" font-weight="800" fill="#7fe3ff">T CELL</text>
  <text x="600" y="318" text-anchor="middle" font-size="32" font-weight="800" fill="#ff8a7a">INFECTED CELL</text>

  <line x1="60" y1="362" x2="840" y2="362" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- ===== B cell -> plasma cell -> antibodies ===== -->
  <circle cx="120" cy="540" r="56" fill="rgba(142,230,168,0.30)" stroke="#8ee6a8" stroke-width="6"/>
  <circle cx="114" cy="534" r="30" fill="rgba(142,230,168,0.55)"/>
  <line x1="186" y1="540" x2="222" y2="540" stroke="#ffffff" stroke-width="7" stroke-linecap="round" marker-end="url(#aw)"/>
  <!-- plasma cell: bigger, off-center nucleus, packed with antibody factory -->
  <ellipse cx="320" cy="540" rx="84" ry="76" fill="rgba(142,230,168,0.30)" stroke="#8ee6a8" stroke-width="6"/>
  <circle cx="286" cy="540" r="28" fill="rgba(142,230,168,0.60)"/>
  <g fill="none" stroke="#8ee6a8" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M330 500 q22 10 40 0 M330 530 q22 10 44 0 M330 560 q22 10 44 0 M330 590 q20 8 34 0"/>
  </g>

  <!-- antibodies released -->
  <use href="#ab" transform="translate(452 505) rotate(70)"/>
  <use href="#ab" transform="translate(470 580) rotate(100)"/>
  <use href="#ab" transform="translate(560 540) rotate(80)"/>

  <!-- viruses tagged by antibodies -->
  <use href="#v" transform="translate(720 505) scale(1.2)"/>
  <use href="#ab" transform="translate(670 505) rotate(90)"/>
  <use href="#ab" transform="translate(720 455) rotate(180)"/>
  <use href="#ab" transform="translate(764 540) rotate(-50)"/>
  <use href="#v" transform="translate(780 640) scale(1.2)"/>
  <use href="#ab" transform="translate(730 640) rotate(90)"/>
  <use href="#ab" transform="translate(780 590) rotate(180)"/>

  <text x="120" y="650" text-anchor="middle" font-size="30" font-weight="800" fill="#8ee6a8">B CELL</text>
  <text x="320" y="662" text-anchor="middle" font-size="30" font-weight="800" fill="#8ee6a8">PLASMA CELL</text>
  <text x="560" y="440" text-anchor="middle" font-size="30" font-weight="800" fill="#ffe08a">ANTIBODIES</text>
  <text x="690" y="652" text-anchor="end" font-size="30" font-weight="800" fill="#ff8a7a">VIRUS</text>
</svg>
