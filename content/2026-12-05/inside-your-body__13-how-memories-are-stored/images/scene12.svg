<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <!-- root -->
  <rect x="300" y="60" width="300" height="90" rx="45" fill="rgba(255,255,255,0.14)" stroke="#ffffff" stroke-width="5"/>
  <text x="450" y="118" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">MEMORY</text>

  <!-- branches -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M400 150 C 380 210 160 200 160 262" stroke="#7fe3ff"/>
    <path d="M450 150 V 262" stroke="#8ee6a8"/>
    <path d="M500 150 C 520 210 740 200 740 262" stroke="#ffe08a"/>
  </g>

  <!-- branch boxes -->
  <rect x="45" y="262" width="230" height="74" rx="22" fill="rgba(127,227,255,0.2)" stroke="#7fe3ff" stroke-width="5"/>
  <rect x="335" y="262" width="230" height="74" rx="22" fill="rgba(142,230,168,0.2)" stroke="#8ee6a8" stroke-width="5"/>
  <rect x="625" y="262" width="230" height="74" rx="22" fill="rgba(255,224,138,0.2)" stroke="#ffe08a" stroke-width="5"/>
  <g font-size="32" font-weight="800" text-anchor="middle">
    <text x="160" y="311" fill="#7fe3ff">EXPLICIT</text>
    <text x="450" y="311" fill="#8ee6a8">IMPLICIT</text>
    <text x="740" y="311" fill="#ffe08a">WORKING</text>
  </g>

  <!-- icon: calendar (facts and events) -->
  <g stroke="#7fe3ff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="102" y="404" width="116" height="100" rx="12" fill="rgba(127,227,255,0.15)"/>
    <path d="M102 434 H218" fill="none"/>
    <line x1="132" y1="392" x2="132" y2="414"/>
    <line x1="188" y1="392" x2="188" y2="414"/>
  </g>
  <g fill="#7fe3ff">
    <circle cx="128" cy="458" r="6"/><circle cx="160" cy="458" r="6"/><circle cx="192" cy="458" r="6"/>
    <circle cx="128" cy="484" r="6"/><circle cx="192" cy="484" r="6"/>
  </g>
  <path d="M160 470 l5 10 l11 1 l-8 7 l3 11 l-11 -6 l-11 6 l3 -11 l-8 -7 l11 -1 Z" fill="#ffe08a"/>

  <!-- icon: bicycle (skills and habits) -->
  <g fill="none" stroke="#8ee6a8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="402" cy="476" r="34"/>
    <circle cx="498" cy="476" r="34"/>
    <path d="M402 476 L 440 476 L 474 432 L 498 476"/>
    <path d="M440 476 L 422 432 M410 428 H436"/>
    <path d="M474 432 L 470 414 H486"/>
  </g>

  <!-- icon: stopwatch (short-term holding) -->
  <g fill="none" stroke="#ffe08a" stroke-width="6" stroke-linecap="round">
    <circle cx="740" cy="462" r="48" fill="rgba(255,224,138,0.15)"/>
    <line x1="740" y1="414" x2="740" y2="400"/>
    <line x1="726" y1="396" x2="754" y2="396"/>
    <line x1="740" y1="462" x2="740" y2="430"/>
    <line x1="740" y1="462" x2="760" y2="474"/>
  </g>

  <!-- sublabels -->
  <g font-size="28" font-weight="700" text-anchor="middle">
    <text x="160" y="590" fill="#e3fbff">FACTS &amp;</text>
    <text x="160" y="628" fill="#e3fbff">EVENTS</text>
    <text x="450" y="590" fill="#e3fbff">SKILLS &amp;</text>
    <text x="450" y="628" fill="#e3fbff">HABITS</text>
    <text x="740" y="590" fill="#e3fbff">SHORT-TERM</text>
    <text x="740" y="628" fill="#e3fbff">HOLDING</text>
  </g>
</svg>
